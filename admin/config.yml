backend:
  name: git-gateway
  branch: main

media_folder: "assets"
public_folder: "assets"

collections:
  - name: "config"
    label: "Portfolio Data"
    files:
      - file: "config.json"
        label: "Konten Utama"
        name: "main"
        fields:
          - { label: "Headline Atas", name: "headline", widget: "string" }
          - { label: "Tentang Saya (Bio)", name: "about", widget: "markdown" }
          - label: "Pengaturan Fitur"
            name: "settings"
            widget: "object"
            fields:
              - { label: "Tampilkan Tombol PDF", name: "show_pdf", widget: "boolean", default: true }
              - { label: "Tampilkan Tombol Booking", name: "show_booking", widget: "boolean", default: true }
              - { label: "Link Tally Form", name: "tally_url", widget: "string" }
          - label: "Seksi Portofolio"
            name: "sections"
            widget: "list"
            fields:
              - { label: "Nama Seksi", name: "name", widget: "string" }
              - label: "Daftar Item"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Tahun", name: "year", widget: "string" }
                  - { label: "Judul", name: "title", widget: "string" }
                  - { label: "Deskripsi", name: "desc", widget: "markdown" }
                  - { label: "Link Media/Video (Optional)", name: "video", widget: "string", required: false }
          - label: "Branding & Footer"
            name: "branding"
            widget: "object"
            fields:
              - { label: "Nama Tampilan Atas/Bawah", name: "footer_name", widget: "string" }
              - { label: "Teks Copyright", name: "copyright", widget: "string" }
