<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Mang Aduy</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <div id="nc-root"></div>

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // Konfigurasi CMS
    CMS.init({
      config: {
        backend: {
          name: "github",
          repo: "mangaduy/portfolio-aduy", // GANTI INI MANG!
          branch: "main"
  base_url: "https://api.netlify.com",
  auth_endpoint: "auth"
        },
        display_url: window.location.origin,
        media_folder: "assets",
        public_folder: "assets",
        collections: [
          {
            name: "config",
            label: "Data Portofolio",
            files: [
              {
                file: "config.json",
                label: "Konten Utama",
                name: "main",
                fields: [
                  { label: "Headline Atas", name: "headline", widget: "string" },
                  { label: "Tentang Saya (Bio)", name: "about", widget: "markdown" },
                  { 
                    label: "Pengaturan Fitur", 
                    name: "settings", 
                    widget: "object", 
                    fields: [
                      { label: "Tampilkan Tombol PDF", name: "show_pdf", widget: "boolean" },
                      { label: "Tampilkan Tombol Booking", name: "show_booking", widget: "boolean" },
                      { label: "Link Tally Form", name: "tally_url", widget: "string" }
                    ]
                  },
                  { 
                    label: "Seksi Portofolio", 
                    name: "sections", 
                    widget: "list", 
                    fields: [
                      { label: "Nama Seksi", name: "name", widget: "string" },
                      { 
                        label: "Daftar Item", 
                        name: "items", 
                        widget: "list", 
                        fields: [
                          { label: "Tahun", name: "year", widget: "string" },
                          { label: "Judul", name: "title", widget: "string" },
                          { label: "Deskripsi", name: "desc", widget: "markdown" },
                          { label: "Link Media", name: "video", widget: "string", required: false }
                        ]
                      }
                    ]
                  },
                  { 
                    label: "Branding & Footer", 
                    name: "branding", 
                    widget: "object", 
                    fields: [
                      { label: "Nama Tampilan Atas/Bawah", name: "footer_name", widget: "string" },
                      { label: "Teks Copyright", name: "copyright", widget: "string" }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
