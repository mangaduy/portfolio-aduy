		<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work With Me | Mang Aduy</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <header role="banner">
        <div class="container" style="text-align:center; padding-top: 60px;">
            <div id="profile-photo-wrapper">
                <img id="profile-photo" src="" alt="Foto Mang Aduy" />
            </div>
            <h1 id="user-name">MANG ADUY</h1>
        </div>
    </header>

    <main role="main">
        <div class="container">
            <section style="margin: 40px 0;">
                <h2 style="color: var(--accent-color); text-transform: uppercase; letter-spacing: 2px; font-family: 'Inter', sans-serif; font-size: 1.1rem;">Work With Me</h2>
                <p style="color: #888; margin-bottom: 30px;">Fill in the form below and I will get back to you as soon as possible.</p>

                <form id="contact-form" action="https://formspree.io/f/mwvzyjvl" method="POST">
                    <input type="hidden" name="subject" value="[Mang Aduy] {{ _What brings you here? }}">

                    <div class="form-group">
                        <label for="name">Your Name <span class="required">*</span></label>
                        <input type="text" id="name" name="Your Name" required />
                    </div>

                    <div class="form-group">
                        <label for="email">Email <span class="required">*</span></label>
                        <input type="email" id="email" name="email" required />
                    </div>

                    <div class="form-group">
                        <label for="whatsapp">WhatsApp Number</label>
                        <input type="text" id="whatsapp" name="WhatsApp Number" />
                    </div>

                    <div class="form-group">
                        <label for="organization">Organization / Brand / Company</label>
                        <input type="text" id="organization" name="Organization" />
                    </div>

                    <div class="form-group">
                        <label for="purpose">What brings you here? <span class="required">*</span></label>
                        <select id="purpose" name="What brings you here?" required>
                            <option value="" disabled selected>Select one</option>
                            <option value="Collaboration">Collaboration</option>
                            <option value="Inquiry">Inquiry</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message">Tell me more <span class="required">*</span></label>
                        <textarea id="message" name="Tell me more" rows="6" required></textarea>
                    </div>

                    <div class="form-group">
                        <label>How did you find me?</label>
                        <div class="checkbox-group">
                            <label class="checkbox-label"><input type="checkbox" name="How did you find me?" value="Instagram" /> Instagram</label>
                            <label class="checkbox-label"><input type="checkbox" name="How did you find me?" value="TikTok" /> TikTok</label>
                            <label class="checkbox-label"><input type="checkbox" name="How did you find me?" value="YouTube" /> YouTube</label>
                            <label class="checkbox-label"><input type="checkbox" name="How did you find me?" value="Google" /> Google</label>
                            <label class="checkbox-label"><input type="checkbox" name="How did you find me?" value="Other" /> Other</label>
                        </div>
                    </div>

                    <button type="submit" class="btn-gold">Send Message</button>
                </form>
            </section>
        </div>
    </main>

    <footer role="contentinfo">
        <div class="container" style="text-align:center; padding: 40px 0;">
            <p id="footer-branding" class="footer-name"></p>
            <p id="copyright-text" class="copyright"></p>
        </div>
    </footer>

    <script>
        async function loadConfig() {
            const res = await fetch('config.json');
            const data = await res.json();
            document.getElementById('user-name').innerText = data.branding.footer_name;
            document.getElementById('footer-branding').innerText = data.branding.footer_name;
            document.getElementById('copyright-text').innerText = data.branding.copyright || '© 2026 Mang Aduy. All Rights Reserved.';
            if(data.branding.photo) {
                const img = document.getElementById('profile-photo');
                img.src = data.branding.photo;
                img.style.display = 'block';
            }
        }
        loadConfig();

        const form = document.getElementById('contact-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = new FormData(form);
            const res = await fetch(form.action, {
                method: 'POST',
                body: data,
                headers: { 'Accept': 'application/json' }
            });
            if(res.ok) {
                window.location.href = 'thankyou.html';
            } else {
                alert('Something went wrong. Please try again.');
            }
        });
    </script>
</body>
</html>
